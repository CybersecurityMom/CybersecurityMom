<title id="title">CybersecurityMom: Human-Centered Technology</title>
<desc id="desc">An animated network connects human-centered technology with cybersecurity, responsible AI, AI evaluation, cloud, education, and building. Selected projects are HOLD UP., AGE Methodology, Parent Radar, and Cyber AI Family Brief.</desc>
